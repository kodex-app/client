name: Build & publish APK

# Builds the Android APK, publishes it as a GitHub Release (a shareable download link), and — only
# when the optional secrets TELEGRAM_TOKEN and TELEGRAM_CHAT_ID are configured — posts the link to
# Telegram.
#
# Three channels, decided by the ref:
#   tag v*      → release → app.kodex.client      → release key → GitHub Release <v*>
#   branch dev  → dev     → app.kodex.client.dev  → *_DEV key   → rolling prerelease `dev`
#   branch main → main    → app.kodex.client      → release key → workflow artifact only
# main is a build check: it proves the release build still assembles and signs, but publishing is
# reserved for tags — a green main is not by itself something to hand people.
# The dev channel is a separate package signed with its own key, so it installs alongside the
# production app and its updates never collide with the released signature.

on:
  push:
    branches: [main, dev]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # create releases / tags

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v5

      # Everything ref-dependent is decided once, here, so the later steps stay dumb.
      - name: Resolve build channel
        id: channel
        run: |
          set -euo pipefail
          # An empty tag means "build only, publish nothing".
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            channel=release; tag="${GITHUB_REF#refs/tags/}"; version="$tag"; app_id_suffix=""
          elif [[ "${GITHUB_REF}" == refs/heads/dev ]]; then
            channel=dev; tag=dev; version="dev-$(git rev-parse --short HEAD)"; app_id_suffix=".dev"
          else
            channel=main; tag=""; version="main-$(git rev-parse --short HEAD)"; app_id_suffix=""
          fi
          {
            echo "channel=${channel}"
            echo "tag=${tag}"
            echo "version=${version}"
          } >> "$GITHUB_OUTPUT"
          # Gradle reads this; empty means "no suffix", i.e. the production applicationId.
          echo "APP_ID_SUFFIX=${app_id_suffix}" >> "$GITHUB_ENV"

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      # Signing keys live only in secrets; build.gradle.kts picks up keystore/release.jks if it
      # exists. The dev channel uses the *_DEV variants — a different key for a different package —
      # and the resolved values are re-exported under the plain names Gradle expects. Fail loudly
      # rather than publishing an APK nobody can install.
      - name: Decode signing keystore
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_DEV: ${{ secrets.KEYSTORE_DEV }}
          KEYSTORE_PASSWORD_DEV: ${{ secrets.KEYSTORE_PASSWORD_DEV }}
          KEY_ALIAS_DEV: ${{ secrets.KEY_ALIAS_DEV }}
          KEY_PASSWORD_DEV: ${{ secrets.KEY_PASSWORD_DEV }}
          CHANNEL: ${{ steps.channel.outputs.channel }}
        run: |
          set -euo pipefail
          # No fallback to the production key: if the _DEV secrets are missing we want a red build,
          # not a dev APK silently signed with the release key.
          [[ "${CHANNEL}" == dev ]] && s=_DEV || s=""
          missing=()
          for name in KEYSTORE KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            ref="${name}${s}"
            [[ -n "${!ref}" ]] || missing+=("${ref}")
          done
          if (( ${#missing[@]} )); then
            echo "Missing signing secrets for the ${CHANNEL} channel: ${missing[*]}" >&2
            exit 1
          fi
          b64_ref="KEYSTORE${s}"
          mkdir -p keystore
          printf '%s' "${!b64_ref}" | base64 -d > keystore/release.jks
          # Re-export under the names build.gradle.kts reads (masked in logs — they are secrets).
          for name in KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            ref="${name}${s}"
            echo "${name}=${!ref}" >> "$GITHUB_ENV"
          done
          pw_ref="KEYSTORE_PASSWORD${s}"; alias_ref="KEY_ALIAS${s}"
          keytool -list -keystore keystore/release.jks -storepass "${!pw_ref}" -alias "${!alias_ref}" > /dev/null

      - name: Build release APK
        run: |
          chmod +x ./gradlew
          ./gradlew :androidApp:assembleRelease --no-daemon --stacktrace

      - name: Stage APK
        id: stage
        env:
          VERSION: ${{ steps.channel.outputs.version }}
        run: |
          set -euo pipefail
          version="${VERSION}"
          apk="$(find androidApp/build/outputs/apk/release -maxdepth 1 -name '*.apk' | head -n1)"
          if [[ -z "$apk" ]]; then echo "No APK produced" >&2; exit 1; fi
          # An unsigned APK builds fine and installs nowhere — check before it reaches a release.
          apksigner="$(find "${ANDROID_HOME}/build-tools" -name apksigner -type f | sort -V | tail -n1)"
          if [[ -z "$apksigner" ]]; then echo "apksigner not found under ${ANDROID_HOME}/build-tools" >&2; exit 1; fi
          "$apksigner" verify --print-certs "$apk"
          name="kodex-client-${version}.apk"
          mkdir -p out
          cp "$apk" "out/${name}"
          {
            echo "version=${version}"
            echo "apk_name=${name}"
            echo "apk_path=out/${name}"
          } >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.stage.outputs.apk_name }}
          path: ${{ steps.stage.outputs.apk_path }}
          if-no-files-found: error

      - name: Publish release
        id: publish
        if: ${{ steps.channel.outputs.tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          APK_PATH: ${{ steps.stage.outputs.apk_path }}
          APK_NAME: ${{ steps.stage.outputs.apk_name }}
          VERSION: ${{ steps.stage.outputs.version }}
          CHANNEL: ${{ steps.channel.outputs.channel }}
          TAG: ${{ steps.channel.outputs.tag }}
        run: |
          set -euo pipefail
          tag="${TAG}"
          if [[ "${CHANNEL}" == release ]]; then
            gh release create "$tag" "$APK_PATH" --title "$tag" --generate-notes \
              || gh release upload "$tag" "$APK_PATH" --clobber
          else
            # Move the rolling dev release/tag to this commit.
            gh release delete "$tag" --yes --cleanup-tag || true
            gh release create "$tag" "$APK_PATH" --title "Dev (${VERSION})" --prerelease \
              --notes "Automated build from ${GITHUB_SHA}."
          fi
          release_url="$(gh release view "$tag" --json url --jq .url)"
          apk_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/${APK_NAME}"
          {
            echo "release_url=${release_url}"
            echo "apk_url=${apk_url}"
          } >> "$GITHUB_OUTPUT"

      - name: Notify Telegram
        if: ${{ steps.channel.outputs.tag != '' && env.TELEGRAM_TOKEN != '' && env.TELEGRAM_CHAT_ID != '' }}
        env:
          VERSION: ${{ steps.stage.outputs.version }}
          CHANNEL: ${{ steps.channel.outputs.channel }}
          RELEASE_URL: ${{ steps.publish.outputs.release_url }}
          APK_URL: ${{ steps.publish.outputs.apk_url }}
        run: |
          set -euo pipefail
          text="$(printf '🤖 New Kodex client APK (%s): %s\nRelease: %s\nDownload: %s' "$CHANNEL" "$VERSION" "$RELEASE_URL" "$APK_URL")"
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${text}" \
            -o /dev/null -w "Telegram sendMessage HTTP %{http_code}\n"
